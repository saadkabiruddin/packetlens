[package]
name = "packetlens"
version = "1.1.0"
edition = "2021"
default-run = "packetlens"
license = "MIT"

[features]
default = []
live = ["dep:pcap"]
gui = ["live", "dep:eframe", "dep:egui_extras", "dep:egui_plot", "dep:rfd"]

[[bin]]
name = "packetlens-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
eframe = { version = "0.37.0", optional = true }
egui_extras = { version = "0.37.0", optional = true }
egui_plot = { version = "0.38.0", optional = true }
pcap = { version = "2.5", optional = true }
rfd = { version = "0.18.0", optional = true }
